name: Data comparator
description: Compares two CSV files and shows rows added, removed, and changed.
tags: [data, diff, spreadsheet, holdings]
owner: risk-team
version: 1.0.0
run:
  dockerfile: ./Dockerfile
  command: python compare.py
inputs:
  - name: file_a
    type: file
    label: Older file
    description: Older file
    bind:
      as: file
      path: /inputs/file_a
  - name: file_b
    type: file
    label: Newer file
    description: Newer file
    bind:
      as: file
      path: /inputs/file_b
outputs:
  - name: report
    type: table
    label: Changes
    description: Rows added, removed, and changed
    bind:
      as: file
      path: /outputs/report.json
      format: json
resources:
  cpu: 1
  memory: 2GB
  gpu: none
  timeout: 60s
data_access: none
sharing: company
